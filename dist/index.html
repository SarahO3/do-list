<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Do List</title><link rel="stylesheet" href="609a232ab53e413e38d2.css"><script defer="defer" src="main.js"></script></head><body><div id="app"><aside id="sidebar"><div class="sidebar-header"><h1>Do List</h1></div><section id="projectsSection"><h2>Projects</h2><div id="projectContainer"></div><button id="addProject">+ Add Project</button></section><section id="unassignedSection"><h2>Unassigned</h2><button id="showUnassigned">Unassigned Todos</button></section></aside><main id="mainContent"><header id="mainHeader"><h1 id="currentProject"></h1><button id="addTodo">+ Add Todo</button></header><section id="todoSection"><div id="todoContainer"></div></section></main></div><dialog id="todoModal"><div class="modal-header"><h2 id="modalTitle">Add Todo</h2><button type="button" id="closeModal" aria-label="Close">×</button></div><div id="todoView" hidden><div class="todo-detail"><h3>Title</h3><p id="viewTitle"></p></div><div class="todo-detail"><h3>Description</h3><p id="viewDescription"></p></div><div class="todo-detail"><h3>Due Date</h3><p id="viewDueDate"></p></div><div class="todo-detail"><h3>Priority</h3><p id="viewPriority"></p></div><div class="todo-detail"><h3>Project</h3><p id="viewProject"></p></div><div class="todo-detail"><h3>Status</h3><p id="viewStatus"></p></div><div class="modal-actions"><button type="button" id="editTodo">Edit</button> <button type="button" id="deleteTodo">Delete</button></div></div><form id="todoForm" hidden><div class="form-group"><label for="todoTitle">Title</label> <input id="todoTitle" name="title" required></div><div class="form-group"><label for="todoDescription">Description</label> <textarea id="todoDescription" name="description" rows="4"></textarea></div><div class="form-group"><label for="todoDueDate">Due Date</label> <input type="date" id="todoDueDate" name="dueDate" required></div><div class="form-group"><label for="todoPriority">Priority</label> <select id="todoPriority" name="priority" required><option value="">Select priority</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div><div class="form-group"><label for="todoProject">Project</label> <select id="todoProject" name="projectId"><option value="">No Project</option></select></div><div class="modal-actions"><button type="button" id="cancelTodo">Cancel</button> <button type="submit" id="saveTodo">Save Todo</button></div></form></dialog><dialog id="projectModal"><div class="modal-header"><h2 id="projectModalTitle">Add Project</h2><button type="button" id="closeProjectModal" aria-label="Close">×</button></div><form id="projectForm"><div class="form-group"><label for="projectName">Project Name</label> <input id="projectName" name="name" required></div><div class="modal-actions"><button type="button" id="cancelProject">Cancel</button> <button type="submit" id="saveProject">Save Project</button></div></form></dialog><dialog id="confirmModal"><div class="modal-header"><h2 id="confirmTitle">Confirm Delete</h2><button type="button" id="closeConfirmModal" aria-label="Close">×</button></div><div class="confirmation-content"><p id="confirmMessage">Are you sure you want to delete this item?</p></div><div class="modal-actions"><button type="button" id="cancelDelete">Cancel</button> <button type="button" id="confirmDelete">Delete</button></div></dialog></body></html>
